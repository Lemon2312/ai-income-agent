# GitHub Actions 上でブログを自動運用するための設定（.github/workflows/blog-agent.yml が使用）
# このファイルを編集して main に push すると、次回の実行から反映されます。

[agent]
data_dir = ".agent"            # 実行履歴・収支のDB（毎回コミットして次回に引き継ぐ）
timezone = "Asia/Tokyo"
currency = "JPY"
usd_to_currency = 150.0
daily_llm_budget_usd = 1.0     # 1日あたりのAI利用料の上限

[llm]
provider = "openai"            # APIキー（リポジトリの Secrets: OPENAI_API_KEY）が必須。未設定なら失敗して通知されます
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"          # 使えるモデル名は OpenAI のダッシュボードで確認できます
api_key_env = "OPENAI_API_KEY"
input_price_per_1m = 0.15      # 予算計算用の料金（USD / 100万トークン）。モデルを変えたら合わせて変更
output_price_per_1m = 0.60

[strategies.freelance_scout]
enabled = false                # 案件スカウトは手元で使う機能のため、ここでは無効

[strategies.content_publisher]
enabled = true
niche = "量子コンピュータのやさしい解説（しくみの基本と、最新の研究論文）"
audience = "量子コンピュータや最先端の研究に興味はあるが、専門知識がない高校生・大学生・社会人"
language = "ja"

# 何を書くか
#   "basics": 下の topics を上から順に、量子コンピュータの基本を1回1テーマで解説する（いまはこちら）
#   "arxiv":  最近の論文を選んで解説する（下の「論文解説の設定」を使う）
# 論文解説に戻すときは source = "arxiv" にし、tags と category も論文解説用に戻します
source = "basics"

# --- 基本解説シリーズの設定 -------------------------------------------------
series_name = "量子コンピュータの基本"
category = "量子コンピュータの基本"   # site/data/categories.toml にある名前
tags = ["量子コンピュータの基本", "量子コンピュータ"]
# シリーズの各回のタイトル（上から順に1本ずつ書きます。並べかえ・追加・削除は自由。書き終わると止まります）
topics = [
  "量子コンピュータってなに？ふつうのコンピュータとのちがい",
  "量子ビットとは？0と1の「重ね合わせ」をさわって理解しよう",
  "測定すると何が起きる？答えが確率で決まるしくみ",
  "量子ビットを増やすとどうなる？2のn乗で増える状態の数",
  "量子ゲートと量子回路：量子コンピュータへの「命令」",
  "量子もつれってなに？離れても結果がそろう不思議",
  "干渉：正しい答えを強め、まちがいを打ち消すしくみ",
  "量子アルゴリズム入門：量子コンピュータが速くなる問題・ならない問題",
  "ノイズとデコヒーレンス：量子コンピュータが苦手なもの",
  "量子誤り訂正：まちがいを直しながら計算するしくみ",
  "量子ビットのつくり方：超伝導・イオン・光など",
  "量子コンピュータは何に役立つ？期待されていることと、まだできないこと",
]

# --- 論文解説の設定（source = "arxiv" のときに使う） ---------------------------
# 論文解説のときの tags の例: tags = ["論文解説", "量子コンピュータ"]、category は "量子コンピュータ"
# 必ず解説したい論文の arXiv 番号（任意）。ここにある論文を最優先で、上から順に記事にします。
# 番号は論文ページのURL（https://arxiv.org/abs/2408.13687 の「2408.13687」）です。例: papers = ["2408.13687"]
papers = []
# リストが空のときは、この条件に合う「最近 recent_days 日以内」の論文の中から、
# 話題のサイン（ニュースでの紹介、有名な論文誌への掲載、大規模な共同研究など）が多いものを優先して、AIが選びます
arxiv_query = 'cat:quant-ph AND (abs:"quantum computer" OR abs:"quantum computing" OR abs:"quantum processor" OR abs:"quantum error correction" OR abs:"quantum algorithm" OR abs:"logical qubit")'
recent_days = 14               # 何日前までの論文を候補にするか
arxiv_candidates = 60          # arXiv から取ってくる候補の数
pick_from = 15                 # 話題のサインが多い順に、AIに見せる候補の数
# 話題を知るためのニュース（RSS）。見出しをAIに見せ、記事中の arXiv へのリンクは「ニュースで紹介」として優先します
news_feeds = [
  "https://phys.org/rss-feed/physics-news/quantum-physics/",
]
read_full_text = true          # 要旨に加えて、論文本文（arXivのHTML版がある場合）も読ませる
full_text_chars = 20000        # 論文本文から読ませる文字数の上限（多いほど詳しく書けるが、AI利用料が少し増える）

# 執筆ルール（基本解説・論文解説の両方）。企画・執筆・採点のすべてでAIに渡され、違反した記事は0点になります
guidelines = [
  "確かめられないことを書かない。論文解説では論文に書かれていない結果・数値・主張を書かず、基本解説では教科書的に確立した内容だけを書く",
  "確かな内容と、理解を助けるための一般的な補足・たとえ話をはっきり分けて書く",
  "誇張しない。「まだできないこと」や限界も書き、量子コンピュータが何でもすぐに解決するような書き方をしない",
  "専門用語には、出てきたその場で中学生にもわかる言葉の説明を添える。数式は最小限にし、使うときは意味を言葉でも説明する",
  "論文や他の文章を長く引用・翻訳して転載しない。自分の言葉で説明する",
  "存在や内容を確認できない研究・企業・人物の具体名を書かず、一般論として書く",
]
site_dir = "site"

# 公開方法
#   "github-pr": 1記事ずつプルリクエストで届く。マージで公開、閉じれば非公開（試し書き期間におすすめ）
#   "git":       確認なしで直接公開（完全自動）
deploy = "github-pr"
fail_on_deploy_error = true    # 公開に失敗したら実行を失敗扱いにしてメールで通知
require_approval = false       # 承認は上の deploy で行うため false のまま

articles_per_run = 1
max_articles_per_day = 1       # 1日の上限（プルリクエストで届いた記事も数える）

# 品質チェック: AI編集長が5項目（実用性・正確性・深さ・読みやすさ・表現の適切さ）を5点満点で採点。
# 正確性は、論文解説では元の論文の要旨・本文と、基本解説では確立した内容と照らし合わせて採点します。
# 平均4点（= 0.8）以上で合格。未満なら見出しごとに書き直し、それでもダメなら公開しない
min_chars = 5000               # 記事全体の文字数の目安（見出しごとの長さもこれに合わせて変わる）
min_quality = 0.8
max_revisions = 2
max_attempts_per_topic = 2     # 不合格になった論文・回を書き直す回数の上限（それを超えたら諦めて次へ）


affiliate_disclosure = "※本記事はアフィリエイト広告（PR）を含みます。"
# アフィリエイトに登録したら、コメントを外してリンクを設定してください。
# [[strategies.content_publisher.affiliate_links]]
# keyword = "（例: 学習サービスや商品の名前）"
# url = "https://（ASPで発行したリンク）"
