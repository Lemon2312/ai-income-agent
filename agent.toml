# GitHub Actions 上でブログを自動運用するための設定（.github/workflows/blog-agent.yml が使用）
# このファイルを編集して main に push すると、次回の実行から反映されます。

[agent]
data_dir = ".agent"            # 実行履歴・収支のDB（毎回コミットして次回に引き継ぐ）
timezone = "Asia/Tokyo"
currency = "JPY"
usd_to_currency = 150.0
daily_llm_budget_usd = 1.0     # 1日あたりのAI利用料の上限

[llm]
provider = "openai"            # APIキー（リポジトリの Secrets: OPENAI_API_KEY）が必須。未設定なら失敗して通知されます
base_url = "https://api.openai.com/v1"
model = "gpt-4o-mini"          # 使えるモデル名は OpenAI のダッシュボードで確認できます
api_key_env = "OPENAI_API_KEY"
input_price_per_1m = 0.15      # 予算計算用の料金（USD / 100万トークン）。モデルを変えたら合わせて変更
output_price_per_1m = 0.60

[strategies.freelance_scout]
enabled = false                # 案件スカウトは手元で使う機能のため、ここでは無効

[strategies.content_publisher]
enabled = true
niche = "理系大学生のためのAI勉強術（ChatGPT等の生成AIを使った、数学・物理・化学・生物などの理解、試験勉強、レポートや実験の準備、英語論文の読解、プログラミング学習、勉強の計画と管理）"
audience = "AIを勉強に活かしたいが、どう使えば理解や成績につながるのか分からない理系の大学生。課題や試験に追われて時間が足りず、効率よく勉強したい人"
language = "ja"
tags = ["大学生", "AI勉強術", "理系"]

# ジャンル固有の執筆ルール。企画・執筆・採点のすべてでAIに渡され、違反した記事は0点になります
guidelines = [
  "レポートや課題をAIに書かせて提出する、試験中に使うなど、大学の不正行為（剽窃・代筆・カンニング）につながる方法は紹介しない。AIは「理解を深める」「自分で考えて書くための補助」として説明する",
  "大学や授業によって生成AIの利用ルールが違うため、課題に関わる内容では「授業や大学のルールを確認する」よう必ず添える",
  "数式・公式・科学的な事実は正確に書く。AIの回答は間違えることがあるため、教科書や講義資料で確かめる手順を示す",
  "読者は大学生なので、無料または学割で使える方法を優先して紹介する",
]
site_dir = "site"

# 公開方法
#   "github-pr": 1記事ずつプルリクエストで届く。マージで公開、閉じれば非公開（試し書き期間におすすめ）
#   "git":       確認なしで直接公開（完全自動）
deploy = "github-pr"
fail_on_deploy_error = true    # 公開に失敗したら実行を失敗扱いにしてメールで通知
require_approval = false       # 承認は上の deploy で行うため false のまま

articles_per_run = 1
max_articles_per_day = 1       # 1日の上限（プルリクエストで届いた記事も数える）

# 品質チェック: AI編集長が5項目（実用性・正確性・深さ・読みやすさ・表現の適切さ）を5点満点で採点。
# 平均4点（= 0.8）以上で合格。未満なら見出しごとに書き直し、それでもダメなら公開しない
min_chars = 3000
min_quality = 0.8
max_revisions = 2
max_attempts_per_topic = 2     # 不合格になったテーマを書き直す回数の上限（それを超えたら諦めて次へ）

topics = [
  "ChatGPTで物理・数学の「わからない」を解消する質問のしかた｜答えを鵜呑みにしない確かめ方つき",
  "AIで試験勉強の計画を立てる方法｜理系大学生の定期試験対策プロンプト集",
  "英語論文をAIで速く正確に読む方法｜理系大学生の文献読解ステップ",
  "実験レポートの考察が書けないときのAI活用法｜丸投げせずに自分の考えを深めるコツ",
  "プログラミングの授業でつまずいたときのAIの使い方｜エラーの原因を理解する聞き方",
]

affiliate_disclosure = "※本記事はアフィリエイト広告（PR）を含みます。"
# アフィリエイトに登録したら、コメントを外してリンクを設定してください。
# [[strategies.content_publisher.affiliate_links]]
# keyword = "（例: 学習サービスや商品の名前）"
# url = "https://（ASPで発行したリンク）"
