name: Tests

on:
  push:
    branches: [main]
    paths: ["income_agent/**", "tests/**", "pyproject.toml"]
  pull_request:
    paths: ["income_agent/**", "tests/**", "pyproject.toml"]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: pytest -q
