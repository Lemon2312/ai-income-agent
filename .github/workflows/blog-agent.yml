name: Blog agent

on:
  # 自動実行は一時停止中。再開するときは下の3行のコメントを外す
  # schedule:
  #   # 毎日 9:23 と 18:23（日本時間）。毎時0分は GitHub が混雑して実行が飛ばされやすいため、ずらしている
  #   - cron: "23 0,9 * * *"
  workflow_dispatch:         # Actions タブの「Run workflow」で手動実行

permissions:
  contents: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: blog-agent
  cancel-in-progress: false

jobs:
  write:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.changes.outputs.published }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "BEFORE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Write articles
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        # 「Run workflow」で手動実行したときは、1日の記事数の上限を無視する（作った記事も上限に数えない）
        run: income-agent -c agent.toml run --once ${{ github.event_name == 'workflow_dispatch' && '--manual' || '' }}
      - name: Save agent state
        if: ${{ !cancelled() }}
        run: |
          git add .agent
          if ! git diff --cached --quiet; then
            git commit -m "Update agent state"
            git push origin HEAD
          fi
      - id: changes
        if: ${{ !cancelled() }}
        run: |
          if git diff --quiet "$BEFORE" HEAD -- site/; then
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: write
    if: ${{ !cancelled() && needs.write.outputs.published == 'true' }}
    uses: ./.github/workflows/pages.yml
