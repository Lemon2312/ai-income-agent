{{- /* The blog's author as a university student who asks Tanerisu the reader's questions (the {{< ask >}} shortcode).
       Params: mood ("" raises a hand | "puzzled" | "surprised" | "happy"), class. */ -}}
{{- $mood := .mood | default "" -}}
<svg class="reader {{ with $mood }}reader-{{ . }}{{ end }} {{ .class }}" viewBox="0 0 120 140" role="img" aria-label="{{ site.Params.readerName | default site.Params.author }}">
  <ellipse class="mascot-shadow" cx="60" cy="134" rx="30" ry="5"/>
  <g class="mascot-body">
    {{- if not $mood }}
    <g class="reader-hand">
      <path class="reader-arm" d="M88 120C99 108 102 96 100 84"/>
      <circle cx="100" cy="78" r="6.5" class="reader-skin"/>
    </g>
    {{- end }}
    <path class="reader-hair" d="M26 70C20 42 36 20 60 20S100 42 94 70Q92 76 88 78 86 70 84 66H36Q34 70 32 78 28 76 26 70z"/>
    <rect x="54" y="86" width="12" height="14" rx="4" fill="#f2cbb0"/>
    <path class="reader-coat" d="M24 138C24 114 40 103 60 103S96 114 96 138z"/>
    <path class="reader-coat" d="M48 97h24v9q-12 5-24 0z"/>
    <path d="M60 107v31" stroke="#1b3f63" stroke-width="1.2"/>
    <circle cx="60" cy="118" r="2" fill="#dbe6f1"/>
    <circle cx="60" cy="130" r="2" fill="#dbe6f1"/>
    <circle cx="32" cy="71" r="6" class="reader-skin"/>
    <circle cx="88" cy="71" r="6" class="reader-skin"/>
    <path d="M31 69q2 2 1 5M89 69q-2 2-1 5" fill="none" stroke="#e79a95" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="60" cy="65" rx="28" ry="27" class="reader-skin"/>

    <g class="mascot-face">
      {{- if eq $mood "happy" }}
      <path class="reader-stroke" d="M42 71q6-7 12 0M66 71q6-7 12 0"/>
      {{- else }}
      {{- $rx := cond (eq $mood "surprised") 5.6 5 }}
      <g class="mascot-eyes">
        <ellipse cx="48" cy="71" rx="{{ $rx }}" ry="{{ add $rx 1.2 }}" fill="#18181d"/>
        <ellipse cx="72" cy="71" rx="{{ $rx }}" ry="{{ add $rx 1.2 }}" fill="#18181d"/>
        <circle class="mascot-glint" cx="50" cy="68" r="1.9"/>
        <circle class="mascot-glint" cx="74" cy="68" r="1.9"/>
        <circle class="mascot-glint" cx="46.4" cy="74" r=".9"/>
        <circle class="mascot-glint" cx="70.4" cy="74" r=".9"/>
      </g>
      {{- end }}
      <ellipse cx="60" cy="79" rx="1.3" ry="1" fill="#e58f8a"/>
      {{- if eq $mood "puzzled" }}
      <path class="reader-stroke" d="M55 85q2.5-2 5 0t5 0"/>
      {{- else if eq $mood "surprised" }}
      <ellipse cx="60" cy="86" rx="2.8" ry="3.4" fill="#7a3b3b"/>
      {{- else if eq $mood "happy" }}
      <path d="M53 83q7 1 14 0-2 7-7 7t-7-7z" fill="#c95f5f" stroke="#3b2a2a" stroke-width="1.3" stroke-linejoin="round"/>
      {{- else }}
      <path class="reader-stroke" d="M56 84q4 3 8 0"/>
      {{- end }}
      <ellipse cx="40" cy="80" rx="5.5" ry="3" fill="#f6a5a0" opacity=".6"/>
      <ellipse cx="80" cy="80" rx="5.5" ry="3" fill="#f6a5a0" opacity=".6"/>
      <path d="M38 79l-1.2 2.2M41 79l-1.2 2.2M79 79l-1.2 2.2M82 79l-1.2 2.2" stroke="#e58585" stroke-width="1" stroke-linecap="round"/>
    </g>

    <path class="reader-hair" d="M27 68C24 42 38 23 60 23S96 42 93 68Q90 62 87 58 86 63 84 66Q82 56 77 50 76 56 73 59Q71 51 65 47 65 54 62 59Q59 50 54 47 54 54 50 59Q48 51 43 49 44 56 40 60Q38 56 35 54 35 60 33 65 30 63 27 68z"/>
    <path class="reader-strand" d="M50 24q3-9 13-10M63 23q6-7 15-4M40 30q-6-3-9 1"/>
    <path d="M38 37q9-8 20-8M68 31q9 1 14 8M46 43q5-3 10-3" fill="none" stroke="#6f7686" stroke-width="2.6" stroke-linecap="round"/>
    {{- if eq $mood "puzzled" }}
    <path class="reader-stroke" d="M42 62q5-3 10 0M68 60q5-1 10 2"/>
    <text class="mascot-q" x="90" y="30">?</text>
    {{- else if eq $mood "surprised" }}
    <path class="reader-stroke" d="M42 61q5-4 10-1M68 60q5-3 10 1"/>
    <text class="mascot-q" x="92" y="30">!</text>
    {{- end }}
  </g>
</svg>
{{- /* keep the whitespace out of inline contexts */ -}}
