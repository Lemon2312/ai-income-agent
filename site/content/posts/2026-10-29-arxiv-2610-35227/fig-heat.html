<figure class="hf" data-hf="heat">
  <p class="hf-title">線を減らすと、冷凍機に入る熱はどうなる？</p>
  <p class="hf-lead">RSA暗号（2048ビット）を解ける規模の量子コンピュータで、制御ラインから冷凍機の最も冷たい段に入る熱を、論文の見積もり方で計算します。スライダーで「何分の1に減らすか」を動かしてみてください。</p>
  <div class="hf-stage">
    <div class="hf-draw">
      <svg viewBox="0 0 360 122" role="img" aria-label="入る熱の大きさを示す目盛り。5から30マイクロワットが冷凍機の冷やせる範囲">
        <rect class="js-band" y="40" height="30" fill="var(--cool)" fill-opacity=".2" rx="4"/>
        <rect x="30" y="106" width="14" height="10" rx="2" fill="var(--cool)" fill-opacity=".35"/>
        <text x="50" y="115" class="t-small t-muted">冷凍機が冷やせる範囲（5〜30μW）</text>
        <line x1="30" y1="70" x2="340" y2="70" stroke="var(--muted)" stroke-width="1.2"/>
        <g class="js-ticks"></g>
        <g class="js-marker" style="transition: transform .45s cubic-bezier(.3,1.3,.5,1)">
          <line x1="0" y1="38" x2="0" y2="72" stroke-width="3"/>
          <path d="M-7 30 L7 30 L0 40 Z"/>
        </g>
      </svg>
    </div>
    <div class="hf-side">
    <label class="hf-range"><span>制御ラインを <b class="js-r">1</b>分の1 に減らす</span>
      <input type="range" min="1" max="60" value="1" step="1">
    </label>
    <div class="hf-controls">
      <button class="hf-btn" type="button" data-r="1" aria-pressed="true">専用線</button>
      <button class="hf-btn" type="button" data-r="12" aria-pressed="false">12分の1（今）</button>
      <button class="hf-btn" type="button" data-r="48" aria-pressed="false">48分の1（理想）</button>
    </div>
    <div class="hf-readout">
      <div><span>制御ラインの本数</span><b class="js-lines"></b></div>
      <div><span>最も冷たい段に入る熱</span><b class="js-heat"></b></div>
    </div>
    <p class="hf-status" aria-live="polite"></p>
    </div>
  </div>
  <p class="hf-note">論文の見積もりの前提：量子ビット38万1000個、1個あたり3本の線（専用線なら114万3000本）、線1本あたり350pW（市販の配線の公表値）。12分の1は今のゲートの性能、48分の1は理想的な条件での論文の見積もりで、本数も論文の値です。</p>
</figure>
