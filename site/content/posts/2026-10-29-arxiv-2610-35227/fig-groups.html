  <p class="hf-title">周波数と時間を組み合わせて線を使い回す</p>
  <p class="hf-lead">誤り訂正の計算では、同時に動くカプラー（量子ビットどうしをつなぐ部品）は一部だけです。同時に動くものは周波数（色）で分け、動く時刻がちがうグループどうしは同じ周波数を使い回します。</p>
  <div class="hf-stage">
    <div class="hf-draw">
      <svg viewBox="0 0 360 290" role="img" aria-label="4かける4に並んだ量子ビットとカプラー。カプラーはAからDの4グループに分かれ、時刻ごとに1つのグループだけが色つきで光るアニメーション">
        <g class="js-grid"></g>
        <g class="js-legend"></g>
      </svg>
    </div>
    <div class="hf-side">
    <div class="hf-controls js-buttons"></div>
    <p class="hf-status" aria-live="polite"></p>
    </div>
  </div>
  <p class="hf-note">イメージ図です。論文では、カプラーを4つのグループに分けて時間で使い回し（1:4）、グループの中は周波数で分けます（1:4）。量子ビットのほうは、1本の線で8個を周波数で分けます（1:8）。この組み合わせで、今のゲートの性能のまま制御ラインを12分の1にできると見積もっています。</p>
