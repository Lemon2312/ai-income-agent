baseURL = "https://example.github.io/"
languageCode = "ja"
title = "{{TITLE}}"
enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 60

[params]
description = "{{DESCRIPTION}}"
author = "{{AUTHOR}}"
# トップの見出しの上に出る小さな英字。空なら非表示
kicker = "Science × AI Study Lab"
# 記事末尾に表示する案内（デジタル商品やツールへの導線）。空なら非表示。
ctaTitle = ""
ctaText = ""
ctaURL = ""

# マスコット「タネリス」。トップページで話すことば（クリックで切り替わる）と、記事の最後のひとこと。
# mascotMessages を空にするとトップページには表示されません
mascotName = "タネリス"
mascotMessages = [
  "いっしょに学ぼう！",
  "気になる記事から読んでみてね",
  "ぼくはタネリス。おもしろい知識のたねを集めてるんだ",
  "しっぽがふくらむのは、ワクワクしてるとき！",
]
mascotOutro = "最後まで読んでくれてありがとう！ 気になったことは、ぜひ試してみてね。"

[taxonomies]
tag = "tags"
category = "categories"

[markup.tableOfContents]
startLevel = 2
endLevel = 3

[pagination]
pagerSize = 12

[[menus.main]]
name = "運営者情報"
pageRef = "/about"
weight = 10

