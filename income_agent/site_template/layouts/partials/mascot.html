{{- /* Mascot "Tanerisu", a squirrel holding a sprouting seed.
       Params: mood ("" | "happy" | "puzzled"), class. */ -}}
{{- $mood := .mood | default "" -}}
<svg class="mascot {{ with $mood }}mascot-{{ . }}{{ end }} {{ .class }}" viewBox="0 0 120 140" role="img" aria-label="マスコットのタネリス">
  <ellipse class="mascot-shadow" cx="60" cy="134" rx="30" ry="5"/>
  <g class="mascot-body">
    <g class="mascot-tail">
      <path d="M74 122C110 120 116 78 98 60 84 46 64 54 70 70 76 84 92 80 92 94 92 106 82 112 70 114z" fill="#d99a5c"/>
      <path d="M80 112C96 104 102 86 94 72" fill="none" stroke="#f0c48f" stroke-width="5" stroke-linecap="round" opacity=".8"/>
    </g>
    <ellipse cx="52" cy="108" rx="24" ry="22" fill="#c47a3e"/>
    <ellipse cx="52" cy="113" rx="14" ry="14" fill="#f3d9b5"/>
    <path d="M33 62l2-20 13 13zM56 54l11-14 2 19z" fill="#c47a3e"/>
    <path d="M36 58l1-10 7 7zM59 54l6-7 1 10z" fill="#f2a7a2"/>
    <circle cx="51" cy="74" r="21" fill="#c47a3e"/>
    <ellipse cx="51" cy="82" rx="12" ry="8" fill="#f3d9b5"/>

    <g class="mascot-face">
      {{- if eq $mood "happy" }}
      <path class="mascot-stroke" d="M39 73q4-5 8 0M55 73q4-5 8 0"/>
      {{- else }}
      <g class="mascot-eyes">
        <circle class="mascot-eye" cx="43" cy="72" r="4"/>
        <circle class="mascot-eye" cx="59" cy="72" r="4"/>
        <circle class="mascot-glint" cx="44.3" cy="70.6" r="1.2"/>
        <circle class="mascot-glint" cx="60.3" cy="70.6" r="1.2"/>
      </g>
      {{- end }}
      <ellipse class="mascot-eye" cx="51" cy="79" rx="2.6" ry="2"/>
      {{- if eq $mood "puzzled" }}
      <path class="mascot-stroke" d="M46 85q2.5-2 5 0t5 0"/>
      {{- else }}
      <path class="mascot-stroke" d="M47 83q4 3 8 0"/>
      {{- end }}
      <ellipse class="mascot-cheek" cx="36" cy="80" rx="6" ry="3.5"/>
      <ellipse class="mascot-cheek" cx="66" cy="80" rx="6" ry="3.5"/>
    </g>

    <g transform="translate(52 111) scale(1.3) translate(-52 -110)">
      <ellipse cx="52" cy="110" rx="9" ry="11" fill="#8a5a2b"/>
      <path d="M52 99c0-3 0-4 0-6m0 3c-4-5-8-4-9-1 3 3 7 3 9 1zm0-1c3-5 8-5 9-2-2 3-6 4-9 2z" fill="#5fb36f" stroke="#3d8f55" stroke-width="1.6"/>
    </g>
    <ellipse cx="38" cy="111" rx="5" ry="4.5" fill="#b06a33"/>
    <ellipse cx="66" cy="111" rx="5" ry="4.5" fill="#b06a33"/>
    {{- if eq $mood "puzzled" }}
    <text class="mascot-q" x="78" y="50">?</text>
    {{- end }}
  </g>
</svg>
{{- /* keep the whitespace out of inline contexts */ -}}
