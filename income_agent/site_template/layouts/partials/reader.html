{{- /* "Haru", a curious student who asks Tanerisu the reader's questions (the {{< ask >}} shortcode).
       Params: mood ("" raises a hand | "puzzled" | "surprised" | "happy"), class. */ -}}
{{- $mood := .mood | default "" -}}
<svg class="reader {{ with $mood }}reader-{{ . }}{{ end }} {{ .class }}" viewBox="0 0 120 140" role="img" aria-label="{{ site.Params.readerName | default "ハル" }}">
  <ellipse class="mascot-shadow" cx="60" cy="134" rx="30" ry="5"/>
  <g class="mascot-body">
    {{- if not $mood }}
    <g class="reader-hand">
      <path class="reader-arm" d="M88 116C98 104 101 92 99 80"/>
      <circle cx="99" cy="74" r="7" fill="#f4cfae"/>
    </g>
    {{- end }}
    <path d="M22 137C22 112 38 100 60 100S98 112 98 137z" fill="#2f7fc1"/>
    <path d="M40 103q20 18 40 0" fill="none" stroke="#5aa5df" stroke-width="5" stroke-linecap="round"/>
    <path d="M53 110v12M67 110v12" stroke="#e8f2fb" stroke-width="2" stroke-linecap="round"/>
    <rect x="53" y="88" width="14" height="14" rx="5" fill="#ecc19c"/>
    <circle cx="32" cy="68" r="5.5" fill="#f4cfae"/>
    <circle cx="88" cy="68" r="5.5" fill="#f4cfae"/>
    <circle cx="60" cy="66" r="28" fill="#f4cfae"/>
    <path d="M31 66C29 42 44 33 60 33S92 42 89 66C85 55 77 50 68 48 63 56 50 58 39 55 35 58 32 62 31 66z" fill="#3a2a22"/>
    <path d="M60 34c-3-9 4-14 9-11-5 2-7 6-6 11" fill="#3a2a22"/>

    <g class="mascot-face">
      {{- if eq $mood "happy" }}
      <path class="mascot-stroke" d="M45 69q4-5 8 0M67 69q4-5 8 0"/>
      {{- else }}
      {{- $r := cond (eq $mood "surprised") 4.6 3.6 }}
      <g class="mascot-eyes">
        <ellipse class="mascot-eye" cx="49" cy="69" rx="{{ $r }}" ry="{{ add $r 0.8 }}"/>
        <ellipse class="mascot-eye" cx="71" cy="69" rx="{{ $r }}" ry="{{ add $r 0.8 }}"/>
        <circle class="mascot-glint" cx="50.4" cy="67.4" r="1.3"/>
        <circle class="mascot-glint" cx="72.4" cy="67.4" r="1.3"/>
      </g>
      {{- end }}
      {{- if eq $mood "puzzled" }}
      <path class="mascot-stroke" d="M43 59q6-3 11 1M66 58q6-2 11 0"/>
      <path class="mascot-stroke" d="M54 83q3-2 6 0t6 0"/>
      {{- else if eq $mood "surprised" }}
      <path class="mascot-stroke" d="M43 59q6-4 11-1M66 58q5-3 11 1"/>
      <ellipse class="mascot-eye" cx="60" cy="83" rx="3.6" ry="4.4"/>
      {{- else if eq $mood "happy" }}
      <path d="M51 78q9 12 18 0z" fill="#9b3d3d"/>
      {{- else }}
      <path class="mascot-stroke" d="M44 60q5-3 10-1M66 59q5-2 10 1"/>
      <path class="mascot-stroke" d="M55 81q5 4 10 0"/>
      {{- end }}
      <ellipse class="mascot-cheek" cx="42" cy="77" rx="5.5" ry="3.2"/>
      <ellipse class="mascot-cheek" cx="78" cy="77" rx="5.5" ry="3.2"/>
    </g>
    {{- if eq $mood "puzzled" }}
    <text class="mascot-q" x="86" y="42">?</text>
    {{- else if eq $mood "surprised" }}
    <text class="mascot-q" x="88" y="42">!</text>
    {{- end }}
  </g>
</svg>
{{- /* keep the whitespace out of inline contexts */ -}}
