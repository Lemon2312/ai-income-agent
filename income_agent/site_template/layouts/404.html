{{ define "main" }}
<section class="not-found">
  {{ partial "mascot.html" (dict "mood" "puzzled" "class" "not-found-mascot") }}
  <h1>ページが見つかりませんでした</h1>
  <p>{{ site.Params.mascotName | default "タネリス" }}も探してみたけれど、このページは移動したか、なくなってしまったみたいです。</p>
  <a class="pager-btn" href="{{ site.Home.RelPermalink }}">トップページへ戻る</a>
</section>
{{ end }}
